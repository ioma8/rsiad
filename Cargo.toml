[package]
name = "rsiad"
version = "0.1.0"
edition = "2021"

[lib]
name = "rsiad"
path = "src/lib.rs"

[[bin]]
name = "rsiad"
path = "src/main.rs"

[[bin]]
name = "rsiad-gui"
path = "src/gui.rs"

[dependencies]
spin_sleep = "1.3.2"
fluidlite = { version = "0.2.0", features = ["bindgen"] }
hound = "3.5.1"
mp3lame-encoder = "0.2.1"
clap = { version = "4.5.8", features = ["derive"] }
cpal = "0.15.3"
serde = { version = "1.0", features = ["derive"] }
once_cell = "1.19.0"
eframe = "0.26.2"
egui = "0.26.2"
rfd = "0.14.1"
catppuccin-egui = "5.6.0"
