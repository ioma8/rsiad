[package]
name = "rsiad"
version = "0.1.0"
edition = "2021"

[lib]
name = "rsiad"
path = "src/lib.rs"

[[bin]]
name = "rsiad"
path = "src/main.rs"

[[bin]]
name = "rsiad-gui"
path = "src/gui.rs"

[[bin]]
name = "rsiad-web"
path = "src/web_server.rs"

[dependencies]
spin_sleep = "1.3.2"
fluidlite = { version = "0.2.0", features = ["bindgen"] }
hound = "3.5.1"
mp3lame-encoder = "0.2.1"
clap = { version = "4.5.8", features = ["derive"] }
cpal = "0.15.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19.0"

# Desktop GUI dependencies
eframe = { version = "0.26.2", optional = true }
egui = { version = "0.26.2", optional = true }
rfd = { version = "0.14.1", optional = true }
catppuccin-egui = { version = "5.6.0", optional = true }

# Web server dependencies
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.5", features = ["fs", "cors"], optional = true }

[features]
default = ["desktop-gui"]
desktop-gui = ["eframe", "egui", "rfd", "catppuccin-egui"]
web-server = ["axum", "tokio", "tower", "tower-http"]
